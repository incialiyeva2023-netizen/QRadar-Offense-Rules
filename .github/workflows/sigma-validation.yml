name: Sigma Rule Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-yaml:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları yüklə (Checkout)
        uses: actions/checkout@v3

      - name: Python mühitini qur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: PyYAML kitabxanasını quraşdır
        run: pip install pyyaml

      - name: Qaydaların (Rule) formatını yoxla
        run: |
          python -c "
          import yaml, glob, sys
          files = glob.glob('rules/*.yml') + glob.glob('rules/*.yaml')
          if not files:
              print('Heç bir rule faylı tapılmadı!')
              sys.exit(1)
          for file in files:
              try:
                  with open(file, 'r', encoding='utf-8') as f:
                      yaml.safe_load(f)
                      print(f'✅ {file} - Sintaksis doğrudur!')
              except Exception as e:
                  print(f'❌ {file} faylında xəta var:\n{e}')
                  sys.exit(1)
          "
